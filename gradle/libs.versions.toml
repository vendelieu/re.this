[versions]
ktor = "3.6.1"

kotlin = "2.4.21"
coroutines = "1.11.0"
io = "0.9.2"
bignum = "0.3.10"
kotlinx-serialization = "1.12.0"

dokka = "2.3.0"
kotlinter = "5.7.0"
deteKT = "1.23.8"
publisher = "0.37.0"
binvalid = "0.18.2"
kover = "0.9.11"

kotest = "6.2.6"
logback = "1.6.6"
rtestcontainers = "3.0.1"

ksp = "2.3.13"
poet = "2.4.0"
autoservice-annotations = "1.1.1"
autoservice-ksp = "1.2.0"
dotenv-kotlin = "6.5.1"

# Security pins: forced on every configuration by buildSrc/src/main/kotlin/security-pins.gradle.kts.
# Any library named `pin-*` below is pinned to its version; any version named `npm-*` becomes a Yarn
# resolution for the Kotlin/JS toolchain. Bump these (Renovate does) instead of editing build scripts.
jackson = "2.22.3"
guava = "33.7.2-jre"
freemarker = "2.3.35"
# renovate: datasource=npm depName=brace-expansion
npm-brace-expansion = "5.0.12"
# renovate: datasource=npm depName=js-yaml
npm-js-yaml = "4.3.2"
# renovate: datasource=npm depName=serialize-javascript
npm-serialize-javascript = "7.1.3"
# renovate: datasource=npm depName=glob
npm-glob = "14.0.2"
# renovate: datasource=npm depName=minimatch
npm-minimatch = "11.0.1"
# renovate: datasource=npm depName=diff
npm-diff = "8.0.3"

[libraries]
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "io" }
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
ktor-network-tls = { module = "io.ktor:ktor-network-tls", version.ref = "ktor" }
ktor-utils = { module = "io.ktor:ktor-utils", version.ref = "ktor" }
bignum = { module = "com.ionspin.kotlin:bignum", version.ref = "bignum" }
serde-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
serde-json-io = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-io", version.ref = "kotlinx-serialization" }

coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
dokka = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
dokka-versioning = { module = "org.jetbrains.dokka:versioning-plugin", version.ref = "dokka" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
publisher = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "publisher" }
kover-gradlePlugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }

# security pins (see [versions])
pin-jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
pin-jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
pin-guava = { module = "com.google.guava:guava", version.ref = "guava" }
pin-freemarker = { module = "org.freemarker:freemarker", version.ref = "freemarker" }

# testing
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-cotest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
test-kotest-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
test-kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
testcontainers-redis = { module = "com.redis:testcontainers-redis", version.ref = "rtestcontainers" }

autoService-annotations = { module = "com.google.auto.service:auto-service-annotations", version.ref = "autoservice-annotations" }
autoService-ksp = { module = "dev.zacsweers.autoservice:auto-service-ksp", version.ref = "autoservice-ksp" }
ksp = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
poet = { module = "com.squareup:kotlinpoet", version.ref = "poet" }
poet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "poet" }
test-dotenv-kotlin = { module = "io.github.cdimascio:dotenv-kotlin", version.ref = "dotenv-kotlin" }

[plugins]
ktlinter = { id = "org.jmailen.kotlinter", version.ref = "kotlinter" }
deteKT = { id = "io.gitlab.arturbosch.detekt", version.ref = "deteKT" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-binvalid = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binvalid" }
kotlin-serde = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }